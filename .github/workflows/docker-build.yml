name: Docker Build & Smoke Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-smoke-test:
    name: Build, Smoke Test & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Guard: a single JS syntax error in index.html silently kills the whole UI (no nav,
      # no pages, only the static shell). The HTTP 200 smoke test cannot see that.
      - name: Validate Mission Control JS and Python syntax, and no leaked identifiers
        run: |
          python3 - <<'EOF'
          import re, subprocess, sys
          s = open('mission-control/index.html', encoding='utf-8').read()
          blocks = [b for b in re.findall(r"<script(?![^>]*src)[^>]*>(.*?)</script>", s, re.S) if len(b) > 10000]
          assert blocks, "main script block not found"
          open('/tmp/main.js', 'w').write(blocks[0])
          r = subprocess.run(['node', '--check', '/tmp/main.js'], capture_output=True, text=True)
          print(r.stderr)
          sys.exit(r.returncode)
          EOF
          python3 -m py_compile mission-control/*.py
          for r in agents faos wiki chat content schedule docs tasks builds; do
            grep -q "route-$r" mission-control/index.html || { echo "missing route $r"; exit 1; }
          done
          if grep -rnIiE "effibit|treasury|codev-dashboard|xpub|tradermax|taile6e66b|100\.65\.|510041509|ryzen5800" . --exclude-dir=.git --exclude-dir=.github; then
            echo "leaked private identifier found"; exit 1
          fi

      - name: Free disk space on runner
        run: |
          echo "Before cleanup:" && df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          docker image prune -af || true
          echo "After cleanup:" && df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ghcr.io/n50sharp/hermes-fleet-appliance:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Smoke Test Container
        run: |
          docker run -d --name appliance-test -p 51763:51763 -p 9119:9119 ghcr.io/n50sharp/hermes-fleet-appliance:latest
          echo "Waiting for appliance services to start..."
          UP=0
          for i in {1..40}; do
            if curl -fsS http://localhost:51763/ >/dev/null 2>&1; then
              echo "Mission Control responded successfully on iteration $i"
              UP=1
              break
            fi
            sleep 2
          done
          if [ $UP -eq 0 ]; then
            echo "Mission Control did not become ready in time."
            docker logs appliance-test
            exit 1
          fi

      - name: Smoke Test Mission Control Endpoint
        run: |
          echo "=== Mission Control Header ==="
          curl -I http://localhost:51763/
          echo "=== Mission Control Title ==="
          curl -s http://localhost:51763/ | grep -i "<title>"

      - name: Smoke Test Hermes Agent CLI & Container Status
        run: |
          docker ps
          docker logs --tail 30 appliance-test
          echo "Checking Hermes command inside container:"
          docker exec appliance-test which hermes
          docker exec appliance-test hermes --version
          docker stop appliance-test
          docker rm appliance-test

      # Regression test for the volume-shadowing bug: a plain `docker run` above has no
      # volumes, so it never exercises what happens when docker-compose.yml's named
      # volume (hermes_data) is mounted fresh/empty at /home/hermes/.hermes, which
      # previously shadowed the baked-in hermes-agent install and broke the `hermes`
      # command on every real `docker compose up`. This step runs the actual compose
      # file end to end and fails the build if that regresses again.
      - name: Compose Up Regression Test (volume-shadowing bug)
        run: |
          docker compose up -d
          echo "Waiting for appliance services to start under docker compose..."
          UP=0
          for i in {1..40}; do
            if curl -fsS http://localhost:51763/ >/dev/null 2>&1; then
              echo "Mission Control responded successfully under compose on iteration $i"
              UP=1
              break
            fi
            sleep 2
          done
          if [ $UP -eq 0 ]; then
            echo "Mission Control did not become ready under docker compose."
            docker compose logs
            docker compose down -v
            exit 1
          fi
          echo "Verifying hermes command survives the mounted volume..."
          docker compose exec -T hermes-appliance which hermes
          docker compose exec -T hermes-appliance hermes --version
          docker compose down -v

      - name: Push to GHCR on Main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/n50sharp/hermes-fleet-appliance:latest
